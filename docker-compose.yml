services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: nl2sql
      LLM_READER_DB_PASSWORD: ${LLM_READER_DB_PASSWORD:?LLM_READER_DB_PASSWORD 필요 — .env 참고}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d nl2sql"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nl2sql
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      EXECUTION_DATASOURCE_URL: jdbc:postgresql://db:5432/nl2sql
      EXECUTION_DATASOURCE_USERNAME: llm_reader
      EXECUTION_DATASOURCE_PASSWORD: ${LLM_READER_DB_PASSWORD:?LLM_READER_DB_PASSWORD 필요 — .env 참고}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 필요 — .env 참고}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY 필요 — .env 참고}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
