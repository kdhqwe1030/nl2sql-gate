openapi: 3.1.0

info:
  title: nl2sql-gate API (현재 구현)
  version: "0.2.0"
  description: |
    지금 백엔드 코드에 실제로 존재하는 엔드포인트만 담은 명세다.

    `docs/nl2sql-gate-API.yml`은 제품이 완성됐을 때의 **목표 설계**(대화 기록,
    관리자 화면, 용어사전 CRUD 등 20여 개 경로)이고, 이 파일은 그중 지금까지
    실제로 구현된 것만 반영한 **현재 상태**다. 두 파일은 서로 다른 시점을 가리키므로
    경로(`/api/v1/...` vs `/api/...`)도, 스키마도 다를 수 있다.

    서버가 떠 있으면 `http://localhost:8080/swagger-ui/index.html`에서 같은 내용을
    springdoc이 코드로부터 직접 생성해 보여준다 — 이 파일은 그 스냅샷을 리포 루트에
    고정해 코드를 열지 않고도 계약을 확인할 수 있게 만든 것.

servers:
  - url: http://localhost:8080

tags:
  - name: auth
    description: 회원가입 / 로그인 / 내 정보
  - name: tenant
    description: 내 회사 정보
  - name: query
    description: 자연어 질문 처리
  - name: schema
    description: 내 role이 볼 수 있는 테이블·컬럼
  - name: user-admin
    description: 구성원 승인 · 역할 관리 (매니저 이상 전용)
  - name: audit
    description: 조회 기록과 사용 현황 (관리자용)
  - name: glossary
    description: 업무 용어 사전 CRUD
  - name: schema-catalog
    description: 데이터 연결 — 전체 테이블/컬럼과 공개 등급 (관리자용)
  - name: debug
    description: LLM 없이 게이트+실행기만 직접 확인 (role 정책 미적용, 개발용)

security:
  - bearerAuth: []

# =====================================================================
paths:

  # ------------------------------- auth -------------------------------
  /api/auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: 가입됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: 입력값 검증 실패 (이메일 형식, 비밀번호 8자 미만 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "409":
          description: 이미 가입된 이메일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

  /api/auth/me:
    get:
      tags: [auth]
      summary: 내 정보 조회
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { description: 인증되지 않음 }

  # ------------------------------ tenant -------------------------------
  /api/tenant:
    get:
      tags: [tenant]
      summary: 내 회사 이름 조회
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantResponse" }
        "401": { description: 인증되지 않음 }

  # ------------------------------ query -------------------------------
  /api/query:
    post:
      tags: [query]
      summary: 자연어 질문 처리
      description: |
        role/tenantId는 요청 본문이 아니라 **서버가 JWT에서 읽은 값**으로만 판정한다.
        클라이언트가 role을 같이 보내도 무시된다.

        생성 → 검증 게이트 → (실패 시 유형별 최대 2회 재시도) → read-only 실행 → 감사 로그
        순으로 처리하고, 세 갈래 결과를 `type`으로 구분해 내려준다. 셋 다 HTTP 200이다 —
        "API 호출이 정상이었는가"와 "질문이 어떻게 처리됐는가"를 분리하기 위해서다.

        | type | 뜻 |
        |---|---|
        | RESULT | SQL 실행 완료, `result`에 표 데이터 |
        | CLARIFY | 기준이 애매해 되물음, `clarify`에 되물을 문장 |
        | ERROR | DENIED(권한 없음) / BLOCKED(SELECT 아님) / ERROR(재시도 후에도 실패) 중 하나, `message`에 안내문 |
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryRequest" }
      responses:
        "200":
          description: 처리됨 (RESULT/CLARIFY/ERROR 중 하나)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryApiResponse" }
        "401": { description: 인증되지 않음 }

  # ----------------------------- schema -------------------------------
  /api/schema:
    get:
      tags: [schema]
      summary: 내 role이 볼 수 있는 테이블·컬럼 목록
      description: |
        `/api/query`가 프롬프트에 넣는 허용 범위와 같은 소스(`DemoRolePolicy`)를 본다.
        권한 밖의 테이블·컬럼은 이름조차 내려가지 않는다.
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaResponse" }
        "401": { description: 인증되지 않음 }

  # ---------------------------- user-admin ------------------------------
  /api/admin/users:
    get:
      tags: [user-admin]
      summary: 구성원 목록 (매니저 이상만)
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "401": { description: 인증되지 않음 }
        "403":
          description: 등급 부족 (매니저 미만)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

  /api/admin/users/{userId}:
    patch:
      tags: [user-admin]
      summary: 승인(active) / 역할 변경 — 자기보다 낮은 등급만 가능
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateInput" }
      responses:
        "200":
          description: 변경됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummary" }
        "401": { description: 인증되지 않음 }
        "403":
          description: 등급 부족 (매니저 미만이거나, 대상이 자기와 동급/상위이거나, 내 등급 이상으로 올리려 함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "404":
          description: 같은 회사에 해당 유저 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

  # ------------------------------ audit ---------------------------------
  /api/admin/query-logs:
    get:
      tags: [audit]
      summary: 조회 기록 (회사 단위, 다른 직원 질문 포함)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/QueryStatus" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: 1~200, 기본 50
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryLogPage" }
        "401": { description: 인증되지 않음 }

  /api/admin/stats:
    get:
      tags: [audit]
      summary: 사용 현황 지표 (월 단위)
      parameters:
        - name: month
          in: query
          description: "YYYY-MM, 생략 시 서버 기본값"
          schema: { type: string, example: "2026-09" }
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsResponse" }
        "401": { description: 인증되지 않음 }

  # ----------------------------- glossary --------------------------------
  /api/admin/glossary:
    get:
      tags: [glossary]
      summary: 용어 목록 (role 무관 전체 공개)
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlossaryTerm" }
        "401": { description: 인증되지 않음 }
    post:
      tags: [glossary]
      summary: 용어 등록 (등록하려는 등급 이상만 가능)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlossaryTermInput" }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlossaryTerm" }
        "401": { description: 인증되지 않음 }
        "403":
          description: 등급 부족
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "409":
          description: 이미 등록된 용어
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

  /api/admin/glossary/{termId}:
    patch:
      tags: [glossary]
      summary: 용어 수정 (해당 용어 등급 이상만 가능)
      parameters:
        - name: termId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlossaryTermInput" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GlossaryTerm" }
        "401": { description: 인증되지 않음 }
        "403":
          description: 등급 부족
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "404":
          description: 용어 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
    delete:
      tags: [glossary]
      summary: 용어 삭제 (해당 용어 등급 이상만 가능)
      parameters:
        - name: termId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 삭제됨 }
        "401": { description: 인증되지 않음 }
        "403":
          description: 등급 부족
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "404":
          description: 용어 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

  # -------------------------- schema-catalog ------------------------------
  /api/admin/tables:
    get:
      tags: [schema-catalog]
      summary: 전체 테이블/컬럼 카탈로그 (데이터 연결 화면용)
      description: |
        role 무관하게 전체 테이블·컬럼과 각 컬럼의 공개 최소 등급(minRoleLevel)을 보여준다.
        아직 DemoRolePolicy(하드코딩) 기반 — 실제 role별 조회 제한은 `/api/query`,
        `/api/schema`가 따로 적용한다.
      responses:
        "200":
          description: 조회됨
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchemaCatalogTable" }
        "401": { description: 인증되지 않음 }

  # ------------------------------ debug --------------------------------
  /api/debug/query:
    post:
      tags: [debug]
      summary: SQL 직접 실행 (게이트 통과분만)
      description: |
        LLM을 거치지 않고 게이트+실행기만 확인하는 개발용 엔드포인트.
        role별 허용 범위(roles.yml)가 아직 없어 데모 스키마 전체를 허용 목록으로 고정해뒀다 —
        실제 사용자 role과 무관하게 항상 같은 범위로 검증한다. 운영 배포 전 제거 대상.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebugQueryRequest" }
      responses:
        "200":
          description: 실행됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResult" }
        "400":
          description: 게이트 검증 실패
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DebugGateFailure" }

# =====================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Role:
      type: string
      enum: [STAFF, MANAGER, ADMIN]
      description: STAFF(10) < MANAGER(50) < ADMIN(100). 숫자 등급(roleLevel)으로 비교한다.

    MessageError:
      type: object
      properties:
        message: { type: string }

    # --------------------------- auth ---------------------------
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8, maxLength: 100 }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
          description: 생략 시 서버 기본값(STAFF)

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: "Bearer" }
        expiresInMs: { type: integer, example: 3600000 }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        roleLevel: { type: integer, example: 10 }

    # --------------------------- tenant ---------------------------
    TenantResponse:
      type: object
      properties:
        name: { type: string, example: "샘플 주식회사" }

    # --------------------------- query ---------------------------
    QueryRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, example: "부서별 인원수 알려줘" }

    QueryStatus:
      type: string
      enum: [SUCCESS, CLARIFY, DENIED, BLOCKED, ERROR]

    QueryResult:
      type: object
      description: LLM을 거치지 않고 백엔드가 DB에서 직접 읽어 채운 실행 결과.
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: {}
        executedSql: { type: string }
        totalCount: { type: integer }
        truncated:
          type: boolean
          description: max-rows(5000)에 걸려 잘린 경우 true

    QueryResultResponse:
      type: object
      description: type=RESULT. status는 항상 SUCCESS.
      properties:
        type: { type: string, const: "RESULT" }
        status: { type: string, const: "SUCCESS" }
        result: { $ref: "#/components/schemas/QueryResult" }

    ClarifyResponse:
      type: object
      description: type=CLARIFY. status는 항상 CLARIFY.
      properties:
        type: { type: string, const: "CLARIFY" }
        status: { type: string, const: "CLARIFY" }
        clarify: { type: string, example: "'작년'의 기준을 회계연도/역년 중 골라주세요" }

    ErrorResponse:
      type: object
      description: type=ERROR. status로 DENIED/BLOCKED/ERROR를 구분한다.
      properties:
        type: { type: string, const: "ERROR" }
        status:
          type: string
          enum: [DENIED, BLOCKED, ERROR]
        message: { type: string, example: "연봉 데이터는 매니저 이상만 볼 수 있습니다" }

    QueryApiResponse:
      oneOf:
        - { $ref: "#/components/schemas/QueryResultResponse" }
        - { $ref: "#/components/schemas/ClarifyResponse" }
        - { $ref: "#/components/schemas/ErrorResponse" }
      discriminator:
        propertyName: type
        mapping:
          RESULT: "#/components/schemas/QueryResultResponse"
          CLARIFY: "#/components/schemas/ClarifyResponse"
          ERROR: "#/components/schemas/ErrorResponse"

    # --------------------------- schema ---------------------------
    SchemaTable:
      type: object
      properties:
        name: { type: string, example: "dept" }
        columns:
          type: array
          items: { type: string }
          example: ["id", "name"]

    SchemaResponse:
      type: object
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/SchemaTable" }

    # --------------------------- user-admin ---------------------------
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        roleLevel: { type: integer, example: 10 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserUpdateInput:
      type: object
      description: 둘 다 선택 필드 — 준 것만 바뀐다. active=true면 승인, role을 주면 등급 변경.
      properties:
        active: { type: boolean }
        role: { $ref: "#/components/schemas/Role" }

    # --------------------------- audit ---------------------------
    QueryLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        userName: { type: string }
        userRole: { $ref: "#/components/schemas/Role" }
        question: { type: string }
        status: { $ref: "#/components/schemas/QueryStatus" }
        deniedDetail: { type: string, nullable: true }
        rowCount: { type: integer, nullable: true }
        latencyMs: { type: integer, nullable: true }
        retryCount: { type: integer }
        executedSql: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    QueryLogPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueryLogEntry" }
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 없으면 null

    StatsResponse:
      type: object
      properties:
        questionCount: { type: integer, format: int64 }
        deniedCount: { type: integer, format: int64 }
        clarifyRate: { type: number, format: double }
        avgLatencyMs: { type: integer, nullable: true }
        topTerms:
          type: array
          description: 용어사전 사용 추적이 아직 없어 항상 빈 배열
          items:
            type: object
            properties:
              term: { type: string }
              count: { type: integer, format: int64 }

    # --------------------------- glossary ---------------------------
    GlossaryTerm:
      type: object
      properties:
        id: { type: string, format: uuid }
        term: { type: string, example: "작년" }
        aliases:
          type: array
          items: { type: string }
        definition: { type: string }
        sqlHint: { type: string, nullable: true }
        relatedTables:
          type: array
          items: { type: string }
        minRoleLevel: { type: integer, example: 10 }
        enabled: { type: boolean }
        hasEmbedding: { type: boolean }
        updatedAt: { type: string, format: date-time }

    GlossaryTermInput:
      type: object
      required: [term, definition]
      properties:
        term: { type: string }
        aliases:
          type: array
          items: { type: string }
        definition: { type: string }
        sqlHint: { type: string }
        relatedTables:
          type: array
          items: { type: string }
        minRoleLevel:
          type: integer
          description: 생략 시 서버 기본값
        enabled:
          type: boolean
          description: 생략 시 서버 기본값(true)

    # --------------------------- schema-catalog ---------------------------
    SchemaCatalogColumn:
      type: object
      properties:
        columnName: { type: string, example: "salary" }
        displayName: { type: string, example: "연봉" }
        minRoleLevel: { type: integer, example: 50 }

    SchemaCatalogTable:
      type: object
      properties:
        tableName: { type: string, example: "emp_public" }
        displayName: { type: string, example: "임직원" }
        description: { type: string, nullable: true }
        columns:
          type: array
          items: { $ref: "#/components/schemas/SchemaCatalogColumn" }

    # --------------------------- debug ---------------------------
    DebugQueryRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string, example: "SELECT id, name FROM dept" }
        params:
          type: array
          items: {}
          description: "sql의 ? 자리에 바인딩할 값. 생략하면 빈 배열."

    DebugGateFailure:
      type: object
      properties:
        ok: { type: boolean, const: false }
        failureType:
          type: string
          enum: [SYNTAX, UNKNOWN_TABLE, FORBIDDEN, NOT_SELECT]
        detail: { type: string }
